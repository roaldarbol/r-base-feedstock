# Builds r-base for all supported platforms and uploads to the
# "isolated-r" channel on prefix.dev using Trusted Publishers (OIDC).
#
# Setup (one-time):
#   On prefix.dev, go to your channel → Settings → Trusted Publishers
#   and add a GitHub publisher for this repo, workflow file
#   "build-and-upload.yml", and branch "isolated".
#
# Triggered by:
#   - Any push to the "isolated" branch (i.e. after a PR is merged)
#   - Manual dispatch

name: Build and upload

on:
  push:
    branches:
      - isolated
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # required for Trusted Publishers OIDC

jobs:
  build-noarch:
    name: Build (noarch placeholder)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install rattler-build
        uses: prefix-dev/rattler-build-action@v0.2.36
        with:
          setup-only: true
          rattler-build-version: latest

      - name: Build
        run: rattler-build build --recipe recipe/noarch/ --output-dir output/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: conda-packages-noarch
          path: output/
          if-no-files-found: error

  build:
    name: Build (${{ matrix.target.platform }})
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - platform: osx-arm64
            runner: macos-14
            variant: osx_arm64
          - platform: osx-64
            runner: macos-15-intel
            variant: osx_64
          - platform: linux-64
            runner: ubuntu-latest
            variant: linux_64
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            variant: linux_aarch64
          - platform: win-64
            runner: windows-latest
            variant: win_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install rattler-build
        uses: prefix-dev/rattler-build-action@v0.2.36
        with:
          setup-only: true
          rattler-build-version: latest

      - name: Set macOS deployment target
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [ "${{ matrix.target.platform }}" = "osx-arm64" ]; then
            echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"
          else
            echo "MACOSX_DEPLOYMENT_TARGET=10.13" >> "$GITHUB_ENV"
          fi

      - name: Build
        shell: bash
        run: |
          rattler-build build \
            --recipe recipe/ \
            -m recipe/variants/${{ matrix.target.variant }}.yaml \
            --output-dir output/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: conda-packages-${{ matrix.target.platform }}
          path: output/
          if-no-files-found: error

  upload:
    name: Upload to prefix.dev
    needs: [build-noarch, build]
    runs-on: ubuntu-latest

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: conda-packages-*
          path: output/
          merge-multiple: true

      - name: Install rattler-build
        uses: prefix-dev/rattler-build-action@v0.2.36
        with:
          setup-only: true
          rattler-build-version: latest

      - name: Upload packages (Trusted Publishers)
        run: |
          find output/ -name "*.conda" | while read pkg; do
            echo "Uploading: $pkg"
            rattler-build upload prefix \
              --channel isolated-r \
              "$pkg"
          done
