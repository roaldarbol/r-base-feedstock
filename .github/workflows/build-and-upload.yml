# Builds r-base for all supported platforms and uploads to the
# "isolated-r" channel on prefix.dev.
#
# Required secret:  PREFIX_DEV_TOKEN
#   A prefix.dev API token with write access to the "isolated-r" channel.
#   Add it in: Settings → Secrets and variables → Actions → New repository secret
#
# Triggered by:
#   - Pushing a version tag:  git tag v4.5.3-1 && git push origin v4.5.3-1
#   - Manual dispatch (with optional dry-run toggle)

name: Build and upload

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — build but do not upload'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  build:
    name: Build (${{ matrix.target.platform }})
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - platform: osx-arm64
            runner: macos-14
            variant: osx_arm64
          - platform: osx-64
            runner: macos-13
            variant: osx_64
          - platform: linux-64
            runner: ubuntu-latest
            variant: linux_64
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            variant: linux_aarch64
          - platform: win-64
            runner: windows-latest
            variant: win_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: isolated

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest

      - name: Install rattler-build
        shell: bash
        run: pixi global install rattler-build

      - name: Build
        shell: bash
        run: |
          rattler-build build \
            --recipe recipe/ \
            -m recipe/variants/${{ matrix.target.variant }}.yaml \
            --output-dir output/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: conda-packages-${{ matrix.target.platform }}
          path: output/
          if-no-files-found: error

  upload:
    name: Upload to prefix.dev
    needs: build
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.dry_run == 'false')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: conda-packages-*
          path: output/
          merge-multiple: true

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest

      - name: Install rattler-build
        run: pixi global install rattler-build

      - name: Upload packages
        env:
          PREFIX_DEV_TOKEN: ${{ secrets.PREFIX_DEV_TOKEN }}
        run: |
          find output/ -name "*.conda" -o -name "*.tar.bz2" | while read pkg; do
            echo "Uploading: $pkg"
            rattler-build upload prefix \
              --channel isolated-r \
              --api-key "$PREFIX_DEV_TOKEN" \
              "$pkg"
          done
